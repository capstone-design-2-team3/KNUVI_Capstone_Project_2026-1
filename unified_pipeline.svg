<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
<title id="title">Adverse-weather 3D vision project overview</title>
<desc id="desc">A stylized scene showing night, snow, LiDAR points, and 3D Gaussian splatting.</desc>
