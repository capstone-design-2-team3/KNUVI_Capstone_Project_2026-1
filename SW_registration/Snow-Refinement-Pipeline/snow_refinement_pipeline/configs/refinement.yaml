software:
  name: Snow Image Refinement Pipeline for 3DGS Reconstruction
  version: 0.3.0

input:
  condition: snow
  required_subdir: input
  supported_extensions:
    - .png
    - .jpg
    - .jpeg
    - .bmp
    - .tif
    - .tiff

output:
  condition: de_snow
  required_subdir: input
  overwrite: true

external_model:
  name: MWFormer
  repo_dir: external/MWFormer
  backbone_path: weights/MWFormer/MWFormer_L/backbone
  style_filter_path: weights/MWFormer/MWFormer_L/style_filter

runtime:
  device: auto
  batch_size: 1
  num_workers: 0
  max_side: 1024
  size_multiple: 16
