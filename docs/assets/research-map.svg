<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520">
<defs>
  <linearGradient id="a" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf9ff"/><stop offset="1" stop-color="#dff0ff"/></linearGradient>
  <linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e8fff7"/><stop offset="1" stop-color="#d9fff0"/></linearGradient>
  <linearGradient id="c" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff7e6"/><stop offset="1" stop-color="#ffe9c9"/></linearGradient>
</defs>
<rect width="1200" height="520" rx="28" fill="#07111f"/>
<text x="60" y="62" fill="#eefaff" font-size="32" font-family="Arial" font-weight="700">Three Complementary Case Studies</text>
<text x="60" y="96" fill="#9bb8cc" font-size="17" font-family="Arial">A unified analysis of adverse-weather degradation across 3D object detection and 3D Gaussian Splatting.</text>
<g font-family="Arial">
  <rect x="60" y="145" width="320" height="270" rx="24" fill="url(#a)"/>
  <text x="92" y="190" fill="#0d2b42" font-size="24" font-weight="700">Night 3DOD</text>
  <text x="92" y="226" fill="#34566a" font-size="16">LiDAR-camera fusion degradation</text>
  <text x="92" y="268" fill="#123" font-size="15">Models: MoME, DeepInteraction, BEVFusion</text>
  <text x="92" y="298" fill="#123" font-size="15">Finding: camera exposure degrades, LiDAR remains stable</text>
  <text x="92" y="328" fill="#123" font-size="15">Low-light enhancement improves image quality</text>
  <text x="92" y="358" fill="#123" font-size="15">but does not reliably improve mAP</text>

  <rect x="440" y="145" width="320" height="270" rx="24" fill="url(#b)"/>
  <text x="472" y="190" fill="#0d2b42" font-size="24" font-weight="700">Snow 3DOD</text>
  <text x="472" y="226" fill="#34566a" font-size="16">LiDAR sparsity and point completion</text>
  <text x="472" y="268" fill="#123" font-size="15">Dataset: KITTI-Snow simulation</text>
  <text x="472" y="298" fill="#123" font-size="15">Pipeline: Sparse U-Net + topology loss + HPR</text>
  <text x="472" y="328" fill="#123" font-size="15">Finding: car points 240 → 350</text>
  <text x="472" y="358" fill="#123" font-size="15">Detection recovery under snowfall</text>

  <rect x="820" y="145" width="320" height="270" rx="24" fill="url(#c)"/>
  <text x="852" y="190" fill="#0d2b42" font-size="24" font-weight="700">Snow 3DGS</text>
  <text x="852" y="226" fill="#34566a" font-size="16">Posed vs. unposed reconstruction</text>
  <text x="852" y="268" fill="#123" font-size="15">Dataset: Snow-conditioned Free</text>
  <text x="852" y="298" fill="#123" font-size="15">Models: COLMAP+3DGS, LongSplat</text>
  <text x="852" y="328" fill="#123" font-size="15">Preprocessing: MWFormer de-snow</text>
  <text x="852" y="358" fill="#123" font-size="15">Metrics: PSNR, SSIM, LPIPS, ATE, RTE, RPE</text>
</g>
</svg>
