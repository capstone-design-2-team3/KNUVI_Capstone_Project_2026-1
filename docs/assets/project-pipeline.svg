  <text x="60" y="276" fill="#c7e5f5" font-family="Arial, sans-serif" font-size="15">Three studies cover nighttime LiDAR-camera fusion, snowfall-induced LiDAR sparsity, and snowy-scene 3DGS reconstruction.</text>
