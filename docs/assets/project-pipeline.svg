  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <text x="60" y="58" fill="#e8f7ff" font-family="Arial, sans-serif" font-size="31" font-weight="700">Adverse Weather 3D Vision Research Pipeline</text>
  <text x="60" y="92" fill="#9fc5dc" font-family="Arial, sans-serif" font-size="17">Dataset construction · 2D / 3D refinement · 3D object detection · 3D Gaussian Splatting analysis</text>
