<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 520" role="img" aria-labelledby="t d">
<title id="t">Night 3D object detection problem and low light enhancement</title>
<desc id="d">Night image quality is improved by low-light enhancement, but model mAP does not reliably improve.</desc>
<rect width="1100" height="520" rx="28" fill="#06111f"/>
<defs>
  <linearGradient id="road" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#1f2937"/><stop offset="1" stop-color="#0f172a"/></linearGradient>
  <marker id="arr" markerWidth="10" markerHeight="10" refX="5" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L8,3 z" fill="#7dd3fc"/></marker>
</defs>
<text x="56" y="70" fill="#e0f2fe" font-family="Arial" font-size="31" font-weight="800">Night 3DOD: brighter image ≠ better detection</text>
<g transform="translate(55 112)">
  <rect x="0" y="0" width="450" height="280" rx="22" fill="#0b1627" stroke="#334155"/>
  <rect x="34" y="45" width="382" height="190" rx="16" fill="url(#road)"/>
  <path d="M50 230 L187 88 L262 88 L400 230" fill="#111827" opacity=".95"/>
  <path d="M222 230 L225 88" stroke="#f8fafc" stroke-width="3" stroke-dasharray="18 18" opacity=".65"/>
  <circle cx="132" cy="119" r="28" fill="#facc15" opacity=".45"/>
  <circle cx="132" cy="119" r="11" fill="#fde68a"/>
  <rect x="285" y="162" width="64" height="30" rx="5" fill="#64748b"/>
  <circle cx="300" cy="194" r="8" fill="#0f172a"/><circle cx="334" cy="194" r="8" fill="#0f172a"/>
  <rect x="276" y="148" width="82" height="56" rx="7" fill="none" stroke="#fb7185" stroke-width="4"/>
  <text x="34" y="263" fill="#cbd5e1" font-size="19" font-family="Arial">Original night camera input</text>
</g>
<path d="M520 250 H625" stroke="#7dd3fc" stroke-width="5" marker-end="url(#arr)"/>
<g transform="translate(645 112)">
  <rect x="0" y="0" width="400" height="280" rx="22" fill="#09202b" stroke="#14532d"/>
  <rect x="34" y="45" width="332" height="190" rx="16" fill="#273549"/>
  <path d="M54 230 L165 91 L235 91 L348 230" fill="#1f2937" opacity=".9"/>
  <path d="M198 230 L201 91" stroke="#f8fafc" stroke-width="3" stroke-dasharray="18 18" opacity=".65"/>
  <circle cx="120" cy="116" r="44" fill="#fde68a" opacity=".4"/>
  <circle cx="120" cy="116" r="15" fill="#fef3c7"/>
  <rect x="245" y="153" width="64" height="30" rx="5" fill="#94a3b8"/>
  <circle cx="260" cy="185" r="8" fill="#0f172a"/><circle cx="294" cy="185" r="8" fill="#0f172a"/>
  <rect x="236" y="139" width="82" height="56" rx="7" fill="none" stroke="#f97316" stroke-width="4"/>
  <text x="34" y="263" fill="#d1fae5" font-size="19" font-family="Arial">CLAHE / EnlightenGAN / Zero-DCE++</text>
</g>
<g transform="translate(88 425)" font-family="Arial">
  <rect width="924" height="58" rx="18" fill="#0f172a" stroke="#334155"/>
  <text x="28" y="36" font-size="22" fill="#f8fafc">Image brightness and low-light ratio improve, but mAP remains flat or decreases due to noise and domain shift.</text>
</g>
</svg>
